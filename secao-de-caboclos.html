<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="logo acervo de mirim site.ico" type="image/x-icon">
  <title>Seção de Caboclos</title>
  <meta name="description" content="Conheça as linhas de caboclos da Escola de Caboclo Mirim." />
  <meta name="author" content="Escola de Caboclo Mirim" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Lato', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #1e6e1e;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    header img {
      max-width: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    header h1 {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      font-size: 2.5em;
      font-weight: 500;
    }

    .caboclos-section {
      padding: 60px 20px;
      background-color: #fff;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      margin: 30px auto;
      max-width: 960px;
      text-align: center;
    }

    .caboclos-section h2 {
      font-size: 2.8em;
      color: #1e6e1e;
      margin-bottom: 40px;
    }

    .caboclos-list a {
      display: block;
      margin: 12px 0;
      font-size: 1.4em;
      text-decoration: none;
      color: #1e6e1e;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .caboclos-list a:hover {
      transform: scale(1.05);
      color: #155e15;
    }

    .btn-voltar {
      margin-top: 40px;
      display: inline-block;
      padding: 12px 24px;
      background-color: #1e6e1e;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.2em;
      transition: background-color 0.3s ease;
    }

    .btn-voltar:hover {
      background-color: #155e15;
    }

    footer {
      background-color: #1e6e1e;
      color: #fff;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }

    footer p {
      margin: 0;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <img src="Logo TEM.png" alt="Logo Escola de Caboclo Mirim" />
    <h1>Seção de Caboclos</h1>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <section class="caboclos-section">
      <h2>Linhas de Caboclos</h2>
      <div class="caboclos-list">
        <a href="caboclos-oxossi.html">Caboclos de Oxóssi</a>
        <a href="caboclos-ogum.html">Caboclos de Ogum</a>
        <a href="caboclos-yemanja.html">Caboclos de Yemanjá</a>
        <a href="caboclos-oxum.html">Caboclos de Oxum</a>
        <a href="caboclos-nana.html">Caboclos de Nanã</a>
        <a href="caboclos-iansa.html">Caboclos de Iansã</a>
        <a href="caboclos-xango.html">Caboclos de Xangô</a>
      </div>

      <!-- Botão de Voltar -->
      <a href="index.html" class="btn-voltar" aria-label="Voltar à página inicial">Voltar à Página Inicial</a>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2025 Escola de Caboclo Mirim. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
